name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (leave empty for latest)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  BINARY: opengrok-mcp
  REGISTRY: docker.io

jobs:
  # ------------------------------------------------------------------
  # Multi-platform binary builds
  # ------------------------------------------------------------------

  build-linux-x86_64:
    name: Build (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p opengrok-mcp --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: target/release/${{ env.BINARY }}

  build-linux-aarch64:
    name: Build (linux-aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --locked
      - run: cross build -p opengrok-mcp --release --locked --target aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@v7
        with:
          name: linux-aarch64
          path: target/aarch64-unknown-linux-gnu/release/${{ env.BINARY }}

  # ------------------------------------------------------------------
  # Docker multi-arch build + push
  # ------------------------------------------------------------------

  docker:
    name: Docker (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build metadata
        id: buildmeta
        run: |
          echo "git_hash=$(git rev-parse --short=8 HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/opengrok-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_HASH=${{ steps.buildmeta.outputs.git_hash }}
            BUILD_DATE=${{ steps.buildmeta.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ------------------------------------------------------------------
  # GitHub Release (binaries)
  # ------------------------------------------------------------------

  create-release:
    name: Create Release
    needs: [build-linux-x86_64, build-linux-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create archives
        run: |
          mkdir -p dist
          VER="${{ steps.version.outputs.version }}"
          for arch in linux-x86_64 linux-aarch64; do
            tar -czf "dist/${BINARY}_${VER}_${arch}.tar.gz" -C "artifacts/${arch}" .
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          files: dist/*
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
